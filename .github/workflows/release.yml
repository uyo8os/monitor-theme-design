name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version tag (vX.Y.Z)"
        required: true
        default: "v2.1.1"
        type: string

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Version must be vMAJOR.MINOR.PATCH"; exit 1;
          }
          THEME_VERSION=$(node -p "require('./theme.json').version")
          [ "$TAG" = "v$THEME_VERSION" ] || {
            echo "::error::Version $TAG does not match theme.json (v$THEME_VERSION)"; exit 1;
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The archive is an installable theme directory rather than a source
      # snapshot: dist/ beside theme.json is the layout a hub reads from
      # <themes>/<short>/, and theme.tar.gz is the one asset name its update button
      # fetches. preview.png sits beside theme.json because it is the panel's
      # thumbnail rather than content the theme serves.
      - run: tar czf theme.tar.gz dist theme.json preview.png
      - run: sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: theme-release
          path: |
            theme.tar.gz
            theme.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: theme-release
      # Never move a tag. A manual run may create the missing tag on the
      # selected commit; annotated tags are dereferenced before comparing.
      - name: Create or verify tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$TAG"
            [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA" ] || {
              echo "::error::Tag $TAG points to a different commit; it will not be moved"; exit 1;
            }
          else
            STATUS=$?
            [ "$STATUS" = 2 ] || { echo "::error::Could not check the remote tag"; exit "$STATUS"; }
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || {
              echo "::error::Tag $TAG is missing"; exit 1;
            }
            git push origin "$GITHUB_SHA:refs/tags/$TAG"
          fi
      - name: Publish GitHub release
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"; exit 1
          fi
          gh release create "$TAG" theme.tar.gz theme.tar.gz.sha256 \
            --generate-notes --latest --verify-tag --repo "$GITHUB_REPOSITORY"
